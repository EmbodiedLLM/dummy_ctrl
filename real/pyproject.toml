[project]
name = "dummy-ctrl-real"
version = "0.1.0"
description = "Real robot environment for dummy control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "appdirs>=1.4.4",
    "av>=15.0.0",
    "fastapi>=0.115.12",
    "grpcio==1.71.0",
    "grpcio-tools==1.62.3",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "lerobot",
    "mediapipe>=0.10.14",
    "mediapy>=1.2.2",
    "numpy>=2.2.4",
    "opencv-python>=4.11.0.86",
    "protobuf==4.25.3",
    "pynput>=1.8.1",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
    "telemoma",
    "uvicorn>=0.34.0",
]

[tool.uv.sources]
telemoma = { path = "../shared/third_party/telemoma_aloha", editable = true }
lerobot = { path = "../shared/third_party/lerobot", editable = true }
